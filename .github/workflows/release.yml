# Builds the release binaries for a v* tag and creates the GitHub Release with
# them. The tag must equal Cargo.toml's version. After the merge the human
# pushes the tag, which starts this. Releases are immutable once published, so
# don't create the release on GitHub: it would publish with no binaries. Run
# it by hand from the Actions tab to retry a tag whose run failed.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: tag must equal Cargo.toml's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "${TAG#v}" = "$version" || { echo "tag $TAG != Cargo.toml version $version"; exit 1; }
      - name: build
        env:
          ORQADENCE_RELEASE: '1'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          cp -f target/${{ matrix.target }}/release/orqa orqa-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: orqa-${{ matrix.target }}
          path: orqa-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: third-party license notices
        run: scripts/third-party-licenses.sh > THIRD-PARTY-LICENSES.txt
      # gh drafts the release, uploads the assets, then publishes it: an
      # immutable release takes no assets after it is published.
      - name: create the release with the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          orqa-aarch64-apple-darwin orqa-x86_64-unknown-linux-gnu THIRD-PARTY-LICENSES.txt
